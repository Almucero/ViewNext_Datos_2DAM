<div class="oj-hybrid-padding">
  <h1>Product Information</h1>
  <oj-bind-if test="[[dataFetched()]]">
    <div id="parentContainer1" class="oj-flex oj-flex-init">
      <div id="activitiesContainer" class="oj-flex-item oj-md-4 oj-sm-12">
        <h3 id="activitiesHeader">Activities</h3>
        <oj-list-view
          id="activitiesList"
          class="item-display"
          aria-labelledby="activitiesHeader"
          data="[[activityDataProvider]]"
          gridlines.item="visible"
          selection-mode="single"
          selected="{{selectedActivity}}"
          on-first-selected-item-changed="[[selectedActivityChanged]]"
          first-selected-item="{{firstSelectedActivity}}"
          scroll-policy="loadMoreOnScroll"
          scroll-policy-options.fetch-size="5"
        >
          <template slot="itemTemplate">
            <div class="oj-flex no-wrap">
              <span
                class="demo-thumbnail oj-flex-item"
                :style.background-image="[[' url('+$current.data.image+')']]"
              ></span>
              <div class="demo-content oj-flex-item">
                <div>
                  <strong>
                    <oj-bind-text value="[[$current.data.name]]"></oj-bind-text>
                  </strong>
                </div>
                <span class="demo-metadata">
                  <oj-bind-text
                    value="[[$current.data.short_desc]]"
                  ></oj-bind-text>
                </span>
              </div>
            </div>
          </template>
        </oj-list-view>
      </div>

      <oj-bind-if test="[[activitySelected()]]">
        <div
          id="parentContainer2"
          class="oj-flex oj-flex-item oj-lg-padding-6x oj-md-8 oj-sm-12"
        >
          <div
            id="activityItemsContainer"
            class="oj-flex-item oj-md-6 oj-sm-12"
          >
            <h3 id="itemsListHeader">Activity Items</h3>

            <oj-button id="createButton" on-oj-action="[[openCreateDialog]]"
              >Create</oj-button
            >
            <oj-button
              id="updateButton"
              disabled="[[!itemSelected()]]"
              on-oj-action="[[openEditDialog]]"
              >Update</oj-button
            >
            <oj-button
              id="viewButton"
              disabled="[[!itemSelected()]]"
              on-oj-action="[[openViewDialog]]"
              >View</oj-button
            >
            <oj-button
              id="deleteButton"
              disabled="[[!itemSelected()]]"
              on-oj-action="[[openDeleteDialog]]"
              >Delete</oj-button
            >

            <oj-list-view
              id="itemsList"
              class="item-display oj-sm-margin-top-12x"
              data="[[itemsDataProvider]]"
              aria-labelledby="itemsListHeader"
              gridlines.item="visible"
              selection-mode="single"
              selected="{{selectedItem}}"
              on-first-selected-item-changed="[[selectedItemChanged]]"
              first-selected-item="{{firstSelectedItem}}"
              scroll-policy="loadMoreOnScroll"
              scroll-policy-options.fetch-size="5"
            >
              <template slot="itemTemplate">
                <div class="oj-flex no-wrap">
                  <span
                    class="demo-thumbnail oj-flex-item"
                    :style.background-image="[[' url('+$current.data.image+')']]"
                  ></span>
                  <div class="demo-content oj-flex-item">
                    <div>
                      <strong
                        ><oj-bind-text
                          value="[[$current.data.name]]"
                        ></oj-bind-text
                      ></strong>
                    </div>
                  </div>
                </div>
              </template>
            </oj-list-view>
          </div>

          <oj-bind-if test="[[itemSelected()]]">
            <div
              id="itemDetailsContainer"
              class="oj-flex-item oj-md-6 oj-sm-12 oj-lg-padding-6x-start"
            >
              <h3>Item Details</h3>
              <hr class="hr-margin" />
              <oj-avatar
                role="img"
                size="lg"
                :src="[[itemData().image]]"
                :aria-label="[['Product image for ' + itemData().name]]"
                class="float-right"
              >
              </oj-avatar>
              <div class="data-name">
                <oj-bind-text value="[[itemData().name]]"></oj-bind-text>
              </div>
              <div class="data-desc">
                <oj-bind-text value="[[itemData().short_desc]]"></oj-bind-text>
              </div>
              <div>
                <oj-bind-text
                  value="[['Price: ' + itemData().price]]"
                ></oj-bind-text>
              </div>
              <div>
                <oj-bind-text
                  value="[['Item Id: ' + itemData().id]]"
                ></oj-bind-text>
              </div>
              <div>
                <oj-chart
                  type="pie"
                  series="[[pieSeriesValue]]"
                  class="chartStyle"
                ></oj-chart>
              </div>
            </div>
          </oj-bind-if>

          <oj-bind-if test="[[!itemSelected()]]">
            <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-padding-6x-start">
              <p>Select an Item to see details</p>
            </div>
          </oj-bind-if>
        </div>

        <demo-update-item-dialog
          id="itemActionDialog"
          style="display: none"
          mode="[[dialogMode]]"
          item="{{inputItem}}"
          activity-key="[[activityKey]]"
          rest-url="[[restServerURLBase]]"
          on-action-complete="[[refreshItems]]"
        >
        </demo-update-item-dialog>
      </oj-bind-if>

      <oj-bind-if test="[[!activitySelected()]]">
        <div class="oj-flex-item oj-sm-6">
          <p>Select an Activity to see Items</p>
        </div>
      </oj-bind-if>
    </div>
  </oj-bind-if>
  <oj-bind-if test="[[!dataFetched()]]">
    <p>Sorry that we couldn't get your product information right now.</p>
  </oj-bind-if>
</div>
