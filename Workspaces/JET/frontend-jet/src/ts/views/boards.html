<!--
  Archivo: ts/views/boards.html
  Proposito: Plantilla de vista con bloques semanticos y enlaces de datos del viewModel.
-->
<div id="wrapper">
  <div style="display: flex; align-items: center">
    <div style="font-size: 32px; color: #ffffff; font-weight: bold">
      <oj-bind-text value="[[t('cards.welcome')]]"></oj-bind-text>
    </div>
    <div style="font-size: 32px; color: #ffffff; font-weight: bold; margin-left: 10px;">
      <oj-bind-text value="[[user().firstName]]"></oj-bind-text>
      <oj-bind-text value="[[user().lastName]]"></oj-bind-text>
    </div>
  </div>

  <div id="tittle">
    <div style="display: flex; flex-wrap: wrap;">
      <div style="flex: 1; flex-basis: auto;">
        <h1 id="wrapperH1"><oj-bind-text value="{{boardName}}"></oj-bind-text></h1>
      </div>
    </div>
    <!-- <h1 id="wrapperH1"><oj-bind-text value="{{boardName}}"></oj-bind-text></h1> -->
    <div>
            <oj-button id="createButton" class="cardButton" on-oj-action="[[showCreateDialog]]"><span data-bind="text: t('cards.create')"></span></oj-button>
      <oj-button id="updateButton" class="cardButton" disabled="[[!userSelected()]]"
              on-oj-action="[[showEditDialog]]"><span data-bind="text: t('cards.updateDelete')"></span></oj-button>
    </div>
  </div>
  <hr />

  <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->
<div class="grid-container">
    <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->
<div class="columna">
      <h1 id="cardsHeader"><oj-bind-text value="[[t('cards.todo')]]"></oj-bind-text></h1>
      <oj-bind-if test="[[isLoadingCards()]]">
        <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->
<div class="cards-skeleton-container">
          <div data-bind="foreach: skeletonTodoRows">
            <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->
<div class="skeleton-card">
              <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->
<div class="skeleton-card-content">
                <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->
<div class="skeleton-card-title"></div>
                <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->
<div class="skeleton-card-date"></div>
                <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->
<div class="skeleton-card-email"></div>
              </div>
            </div>
            <div aria-hidden="true" style="height: 50px;"></div>
          </div>
        </div>
      </oj-bind-if>
      <oj-bind-if test="[[!isLoadingCards()]]">
        <oj-list-view id="activitiesList1" class="card-display" aria-labelledby="cardsHeader" data="[[cardSourceTodo]]"
                      gridlines.item="visible" selection-mode="single" selected="{{selectedItemTodo}}"
                      on-selected-changed="[[selectedItemChangedTodo]]" scroll-policy="loadMoreOnScroll"
                      dnd.drag.items.data-types='["application/ojlistviewitems+json"]'
                      dnd.drag.items.drag-start="[[handleStart]]" dnd.drag.items.drag-end="[[handleEnd]]"
                      dnd.drop.items.data-types='["application/ojlistviewitems+json"]'
                      dnd.drop.items.drop="[[handleDrop.bind($data, 'activitiesList1')]]">
          <template slot="itemTemplate">
            <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->
<div class="card"
                 role="button" tabindex="0" class="oj-sm-margin-4x-horizontal oj-listview-drag-handle">
              <div>
                <strong>
                  <oj-bind-text value="[[$current.data.title]]"></oj-bind-text>
                </strong>
              </div>
              <div>
                <span class="demo-metadata">
                  <oj-bind-text value="[[$current.data.endDate]]"></oj-bind-text>
                </span>
              </div>
              <div>
                <span class="demo-metadata">
                  <oj-bind-text value="[[$current.data.user.email]]"></oj-bind-text>
                </span>
              </div>
              <div role="button" tabindex="0" class="oj-sm-margin-4x-horizontal oj-listview-drag-handle">
              </div>
            </div>
          </template>
        </oj-list-view>
      </oj-bind-if>
    </div>

    <!-- Bloque de interfaz: agrupacion de controles y contenido visible. -->

  <oj-dialog id="createDialog" style="display: none" dialog-title="[[t('cards.dialogCreateTitle')]]" cancel-behavior="icon">
    <div slot="body">
      <oj-bind-if test="[[demoComponentReady()]]">
        <demo-component mode="Create" card="{{card()}}"> </demo-component>
      </oj-bind-if>
      <oj-bind-if test="[[!demoComponentReady()]]">
        <oj-form-layout>
          <oj-input-text value="{{card().title}}" label-hint="[[t('cards.cardName')]]" required></oj-input-text>
          <oj-input-text value="{{card().description}}" label-hint="[[t('cards.cardDescription')]]"></oj-input-text>
          <oj-input-date value="{{card().startDate}}" max="[[card().endDate]]" label-hint="[[t('cards.startDate')]]"></oj-input-date>
          <oj-input-date value="{{card().endDate}}" min="[[card().startDate]]" label-hint="[[t('cards.endDate')]]"></oj-input-date>
          <oj-input-text value="{{card().priority}}" label-hint="[[t('cards.priority')]]"></oj-input-text>
          <oj-select-single data="[[createStatusDP]]" value="{{createStatusValue}}" label-hint="[[t('cards.status')]]"></oj-select-single>
        </oj-form-layout>
      </oj-bind-if>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[createCard]]"><span data-bind="text: t('common.create')"></span></oj-button>
    </div>
  </oj-dialog>

  <oj-dialog id="editDialog" style="display: none" dialog-title="[[t('cards.dialogEditTitle')]]" cancel-behavior="icon">
    <div slot="body">
      <oj-bind-if test="[[demoComponentReady()]]">
        <demo-component mode="Edit" card="{{card()}}"></demo-component>
      </oj-bind-if>
      <oj-bind-if test="[[!demoComponentReady()]]">
        <oj-form-layout>
          <oj-input-text value="{{card().title}}" label-hint="[[t('cards.cardName')]]" required></oj-input-text>
          <oj-input-text value="{{card().description}}" label-hint="[[t('cards.cardDescription')]]"></oj-input-text>
          <oj-input-date value="{{card().startDate}}" max="[[card().endDate]]" label-hint="[[t('cards.startDate')]]"></oj-input-date>
          <oj-input-date value="{{card().endDate}}" min="[[card().startDate]]" label-hint="[[t('cards.endDate')]]"></oj-input-date>
          <oj-input-text value="{{card().priority}}" label-hint="[[t('cards.priority')]]"></oj-input-text>
          <oj-select-single data="[[statusDP]]" value="{{statusValue}}" on-value-changed="[[onStatusValueChanged]]" label-hint="[[t('cards.status')]]"></oj-select-single>
        </oj-form-layout>
      </oj-bind-if>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[deleteCard]]"><span data-bind="text: t('common.delete')"></span></oj-button>
      <oj-button on-oj-action="[[updateCard]]"><oj-bind-text value="[[t('common.update')]]"></oj-bind-text></oj-button>
    </div>
  </oj-dialog>
