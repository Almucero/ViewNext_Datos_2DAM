<!DOCTYPE html>
<!--
  Archivo: ts/views/admin.html
  Proposito: Estructura principal de la vista y zonas de interaccion enlazadas con Knockout/OJET.
  Nota: Se comenta por bloques semanticos para facilitar mantenimiento.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>users</title>
    <style>
      .usuario-card {
        color: rgb(2, 29, 36);
        padding: 10px;
      }

      .usuario-card-line {
        display: flex;
        align-items: center;
      }
      .usuario-card-line > * {
        margin-right: 10px;
      }
      .separator-bar {
        border-left: 1px solid rgb(2, 2, 2);
        height: 1.2em;
        margin: 0 10px;
      }
      .white-button {
        background-color: white;
        color: rgb(6, 64, 80);
        border: 1px solid #ccc;
      }
      .white-button:hover {
        background-color: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <!-- Shell de aplicacion: accesibilidad, drawer, header y contenedor del modulo activo. -->
    <div class="oj-hybrid-padding">
      <!-- Button to create a new user -->
      <div style="text-align: right">
        <oj-button class="white-button" on-oj-action="[[openCreateUserDialog]]"
          ><oj-bind-text value="[[t('admin.createUser')]]"></oj-bind-text></oj-button
        >
        <oj-button
          class="white-button"
          on-oj-action="[[openUpdateUserDialog]]"
          disabled="[[!userSelected()]]"
          ><oj-bind-text value="[[t('admin.updateUser')]]"></oj-bind-text></oj-button
        >
        <oj-button
          class="white-button"
          on-oj-action="[[openDeleteUserDialog]]"
          disabled="[[!userSelected()]]"
          ><oj-bind-text value="[[t('admin.deleteUser')]]"></oj-bind-text></oj-button
        >
        <oj-button
          class="white-button"
          on-oj-action="[[openAsignDialog]]"
          disabled="[[!userSelected()]]"
          ><oj-bind-text value="[[t('admin.assignBoard')]]"></oj-bind-text></oj-button
        >
      </div>

      <!-- Lista de usuarios -->
      <div class="usuarios-container">
        <h1 id="cardsHeader" style="color: rgb(3, 37, 46)"><oj-bind-text value="[[t('admin.title')]]"></oj-bind-text></h1>
        <oj-list-view
          id="activitiesList1"
          class="usuarios-grid"
          aria-labelledby="cardsHeader"
          data="[[userDatasourse]]"
          gridlines.item="visible"
          selection-mode="single"
          scroll-policy="loadMoreOnScroll"
          on-selected-changed="[[selectUser]]"
        >
          <template slot="itemTemplate">
            <div class="usuario-card">
              <div class="usuario-card-line">
                <span class="usuario-card-label"><strong><oj-bind-text value="[[t('admin.firstName')]]"></oj-bind-text></strong></span>
                <span
                  ><strong
                    ><oj-bind-text
                      value="[[$current.data.firstName]]"
                    ></oj-bind-text></strong
                ></span>
              </div>
              <div class="usuario-card-line">
                <span class="usuario-card-label"
                  ><strong><oj-bind-text value="[[t('admin.lastName')]]"></oj-bind-text></strong></span
                >
                <span
                  ><strong
                    ><oj-bind-text
                      value="[[$current.data.lastName]]"
                    ></oj-bind-text></strong
                ></span>
              </div>
              <div class="usuario-card-line">
                <span class="usuario-card-label"><strong><oj-bind-text value="[[t('admin.email')]]"></oj-bind-text></strong></span>
                <span
                  ><strong
                    ><oj-bind-text
                      value="[[$current.data.email]]"
                    ></oj-bind-text></strong
                ></span>
              </div>
              <div class="usuario-card-line">
                <span class="usuario-card-label"><strong><oj-bind-text value="[[t('admin.role')]]"></oj-bind-text></strong></span>
                <span
                  ><strong
                    ><oj-bind-text
                      value="[[$current.data.role.name]]"
                    ></oj-bind-text></strong
                ></span>
              </div>
              <oj-bind-if test="[[$current.data.boards !== null]]">
                <div class="usuario-card-line">
                  <span class="usuario-card-label"
                    ><strong><oj-bind-text value="[[t('admin.boards')]]"></oj-bind-text></strong></span
                  >
                  <span
                    ><strong
                      ><oj-bind-text
                        value="[[getBoards($current.data.boards.board)]]"
                      ></oj-bind-text></strong
                  ></span>
                </div>
              </oj-bind-if>
              <!-- Botón Asignar tablero -->
            </div>
          </template>
        </oj-list-view>
      </div>

      <!-- Dialog to create a new user -->
      <oj-dialog id="createUserDialog" dialog-title="[[t('admin.dialogCreateUser')]]">
        <div>
          <oj-form-layout>
            <oj-input-text
              id="newFirstName"
              label-hint="[[t('auth.firstName')]]"
              value="{{user().firstName}}"
            ></oj-input-text>
            <oj-input-text
              id="newLastName"
              label-hint="[[t('auth.lastName')]]"
              value="{{user().lastName}}"
            ></oj-input-text>
            <oj-input-text
              id="newEmail"
              label-hint="[[t('auth.email')]]"
              value="{{user().email}}"
            ></oj-input-text>
            <oj-input-text
              id="newPassword"
              label-hint="[[t('auth.password')]]"
              value="{{user().password}}"
            ></oj-input-text>
            <div class="oj-form-control-max-width-md">
              <oj-select-single
                label-hint="[[t('admin.roleInput')]]"
                label-edge="inside"
                data="[[rolesDP]]"
                value="{{user().role}}"
              >
              </oj-select-single>
            </div>

            <oj-select-many
              id="select"
              value="{{user().boards.board}}"
              label-hint="[[t('admin.boardsInput')]]"
              options="[[boardsDP]]"
              class="oj-form-control-max-width-md"
            >
            </oj-select-many>

            <oj-button on-oj-action="[[addUser]]"><oj-bind-text value="[[t('admin.add')]]"></oj-bind-text></oj-button>
            <oj-button on-oj-action="[[closeCreateUserDialog]]"
              ><oj-bind-text value="[[t('admin.cancel')]]"></oj-bind-text></oj-button
            >
          </oj-form-layout>
        </div>
      </oj-dialog>
    </div>

    <!-- Dialog to update a user -->
    <oj-dialog id="editDialog" dialog-title="[[t('admin.dialogUpdateUser')]]">
      <div>
        <oj-form-layout>
          <oj-input-text
            id="editFirstName"
            label-hint="[[t('auth.firstName')]]"
            value="{{user().firstName}}"
          ></oj-input-text>
          <oj-input-text
            id="editLastName"
            label-hint="[[t('auth.lastName')]]"
            value="{{user().lastName}}"
          ></oj-input-text>
          <oj-input-text
            id="editEmail"
            label-hint="[[t('auth.email')]]"
            value="{{user().email}}"
          ></oj-input-text>
          <oj-input-text
            id="editPassword"
            label-hint="[[t('auth.password')]]"
            value="{{user().password}}"
          ></oj-input-text>
          <div class="oj-form-control-max-width-md">
            <oj-select-single
              label-hint="[[t('admin.roleInput')]]"
              label-edge="inside"
              data="[[rolesDP]]"
              value="{{user().role}}"
            >
            </oj-select-single>
          </div>
          <oj-select-many
            id="select"
            value="{{user().boards.board}}"
            label-hint="[[t('admin.boardsInput')]]"
            options="[[boardsDP]]"
            class="oj-form-control-max-width-md"
          >
          </oj-select-many>

          <oj-button on-oj-action="[[updateUser]]"><oj-bind-text value="[[t('admin.saveChanges')]]"></oj-bind-text></oj-button>
          <oj-button on-oj-action="[[closeUpdateUserDialog]]"
            ><oj-bind-text value="[[t('admin.cancel')]]"></oj-bind-text></oj-button
          >
        </oj-form-layout>
      </div>
    </oj-dialog>

    <!-- Dialog to delete a user -->
    <oj-dialog id="deleteUserDialog" dialog-title="[[t('admin.dialogDeleteUser')]]">
      <div>
        <p>
          <oj-bind-text value="[[t('admin.deleteConfirm')]]"></oj-bind-text>
          <strong
            ><oj-bind-text value="{{user().firstName}}"></oj-bind-text>
            <oj-bind-text value="{{user().lastName}}"></oj-bind-text></strong
          >?
        </p>
        <oj-button on-oj-action="[[deleteUser]]"><oj-bind-text value="[[t('common.delete')]]"></oj-bind-text></oj-button>
        <oj-button on-oj-action="[[closeDeleteUserDialog]]"><oj-bind-text value="[[t('admin.cancel')]]"></oj-bind-text></oj-button>
      </div>
    </oj-dialog>

    <!-- Dialog to assign boards to a user -->
    <oj-dialog id="AsignBoardDialog" dialog-title="[[t('admin.dialogAssignBoards')]]">
      <oj-select-many
        id="select"
        value="{{user().boards.board}}"
        label-hint="[[t('admin.boardsInput')]]"
        options="[[boardsDP]]"
        class="oj-form-control-max-width-md"
      >
      </oj-select-many>
      <oj-button on-oj-action="[[asignar]]"><oj-bind-text value="[[t('admin.assign')]]"></oj-bind-text></oj-button>
      <oj-button on-oj-action="[[closeAsignDialog]]"><oj-bind-text value="[[t('admin.cancel')]]"></oj-bind-text></oj-button>
    </oj-dialog>

    <oj-dialog id="emailDialog" dialog-title="[[t('admin.dialogChangeEmail')]]">
      <div>
        <p><oj-bind-text value="[[t('admin.changeEmailConfirm')]]"></oj-bind-text> <strong><oj-bind-text value="{{user().email}}"></oj-bind-text> <oj-bind-text value="{{user().lastName}}"></oj-bind-text></strong>?</p>
        <oj-button on-oj-action="[[updateEmailUser]]"><oj-bind-text value="[[t('admin.accept')]]"></oj-bind-text></oj-button>
        <oj-button on-oj-action="[[closeEmailDialog]]"><oj-bind-text value="[[t('admin.cancel')]]"></oj-bind-text></oj-button>

      </div>
    </oj-dialog>

    <script type="module" src="path/to/your/js/viewModel.js"></script>
  </body>
</html>
