<!-- ************************ IMPORTANT INFORMATION ************************************
  This web navigation drawer template is provided as an example of how to configure
  a JET web application with a navigation drawer as a single page application
  using ojRouter and oj-module.  It contains the Oracle JET framework and a default
  requireJS configuration file to show how JET can be setup in a common application.
  This project template can be used in conjunction with demo code from the JET
  website to test JET component behavior and interactions.

  Any CSS styling with the prefix "demo-" is for demonstration only and is not
  provided as part of the JET framework.

  Please see the demos under Cookbook/Patterns/App Shell: Web and the CSS documentation
  under Support/API Docs/Non-Component Styling on the JET website for more information on how to use
  the best practice patterns shown in this template.

  Aria Landmark role attributes are added to the different sections of the application
  for accessibility compliance. If you change the type of content for a specific
  section from what is defined, you should also change the role value for that
  section to represent the appropriate content type.
  ***************************** IMPORTANT INFORMATION ************************************ -->
<html lang="en-us">
  <head>
    <title>Hive-5</title>

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1"
    />
    <!-- <a href="http://localhost:8000">
      <img src="./css/images/Hive5_LOGO.png" alt="Hive5 Logo" class="clickable-image">
    </a> -->
    

    <!-- This is the main css file for the default theme -->
    <!-- injector:theme -->
    <!-- endinjector -->

    <!-- This contains icon fonts used by the starter template -->
    <link
      rel="stylesheet"
      id="uxiconFont"
      href="https://static.oracle.com/cdn/fnd/gallery/2404.0.0/images/iconfont/ojuxIconFont.min.css"
    />

    <!-- This is where you would add any app specific styling -->
    <link rel="stylesheet" href="./css/app.css" type="text/css" />
  </head>
  <body class="oj-web-applayout-body">
    <!-- Shell de aplicacion: accesibilidad, drawer, header y contenedor del modulo activo. -->
    <!-- Template for rendering navigation items shared between nav bar and nav list -->
    <script type="text/html" id="navTemplate">
      <li>
        <a href="#">
          <span :class="[[$data.detail.iconClass]]"></span>
          <span data-bind="text: $data.detail.label"></span>
        </a>
      </li>
    </script>

    <div id="globalBody">
      <div
        id="announce"
        tabindex="-1"
        class="sendOffScreen"
        :aria-live="[[manner]]"
        aria-atomic="true"
      >
        <p id="ariaLiveMessage">
          <oj-bind-text value="[[message]]"></oj-bind-text>
        </p>
      </div>

      <!--
         ** Oracle JET V16.0.0 web application navigation drawer pattern.
         ** Please see the demos under Cookbook/Patterns/App Shell: Web
         ** and the CSS documentation under Support/API Docs/Non-Component Styling
         ** on the JET website for more information on how to use this pattern.
         ** The off-canvas section is used when the browser is resized to a smaller media
         ** query size for a phone format and hidden until a user clicks on
         ** the header hamburger icon.
      -->
      <oj-drawer-popup
        id="navDrawer"
        edge="start"
        opened="{{sideDrawerOn}}"
        modality="modeless"
        role="navigation"
        class="oj-bg-neutral-170 oj-color-invert"
        on-opened-changed="[[openedChangedHandler]]"
      >
        <oj-navigation-list
          id="navDrawerList"
          data="[[navDataProvider]]"
          item.renderer="[[oj.KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
          on-click="[[toggleDrawer]]"
          selection="{{selection.path}}"
        >
        </oj-navigation-list>
      </oj-drawer-popup>
      <div id="pageContent" class="oj-web-applayout-page">
        <!--
           ** Oracle JET V16.0.0 web application header pattern.
           ** Please see the demos under Cookbook/Patterns/App Shell: Web
           ** and the CSS documentation under Support/API Docs/Non-Component Styling
           ** on the JET website for more information on how to use this pattern.
        -->
        <header role="banner" class="oj-web-applayout-header">
          <div class="header-main-strip">
            <img src="/css/images/viewnext-cabecera.png" alt="Viewnext" class="header-viewnext-logo-top">
            <div class="oj-web-applayout-max-width header-main-content">
              <div class="container1">
                <a href="#" data-bind="click: onLogoClick" title="Go to Home" data-i18n-title="app.goHomeTitle" class="hive-logo-link">
                  <img src="/css/images/Hive5_LOGO.png" alt="Hive-5" class="clickable-image">
                </a>
                <div class="brand-copy" aria-label="Hive-5 Viewnext Digital Workplace">
                  <h1>Hive-5</h1>
                  <p class="brand-subtitle" data-i18n="app.brandSubtitle">VIEWNEXT DIGITAL WORKPLACE</p>
                </div>
              </div>
              
              <oj-bind-if test="[[showHeaderNav]]">
                <div id="nav" role="navigation" class="header-project-nav">
                  <oj-navigation-list
                    id="navTabBar"
                    class="oj-sm-only-hide oj-md-condense oj-md-justify-content-flex-end"
                    data="[[navDataProvider]]"
                    edge="top"
                    item.renderer="[[oj.KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
                    selection="{{selection.path}}"
                  >
                  </oj-navigation-list>
                  <oj-bind-if test="[[currentUser()]]">
                    <oj-menu-button id="headerMenuButton" chroming="outlined" display="all">
                      <span data-i18n="app.menu">Menu</span>
                      <oj-menu slot="menu">
                        <oj-option disabled>
                          <span data-bind="text: currentUser() ? currentUser().firstName + ' ' + currentUser().lastName : ''"></span>
                        </oj-option>
                        <oj-option on-click="[[goToProfile]]">
                          <span data-i18n="app.myProfile">My profile</span>
                        </oj-option>
                        <oj-option on-click="[[logout]]">
                          <span data-i18n="app.signOut">Sign out</span>
                        </oj-option>
                      </oj-menu>
                    </oj-menu-button>
                  </oj-bind-if>
                </div>
              </oj-bind-if>
            </div>
          </div>
        </header>
                <!-- Punto de montaje de vistas dinamicas segun router activo. -->
<oj-module
          role="main"
          class="oj-web-applayout-max-width oj-web-applayout-content"
          config="[[moduleAdapter.koObservableConfig]]"
        >
        </oj-module>
        <footer class="oj-web-applayout-footer" role="contentinfo">
          <div
            class="oj-web-applayout-footer-item oj-web-applayout-max-width oj-text-color-secondary oj-typography-body-sm"
            data-i18n="app.footerCopyright"
          >
            Copyright © 2024 Hive-5 and/or its affiliates. All rights reserved.
          </div>
        </footer>
      </div>
      <button class="language-toggle-button" data-bind="click: toggleLanguage, text: languageLabel" type="button" aria-label="Toggle language"></button>
    </div>

    <!-- This injects script tags for the main javascript files -->
    <!-- injector:scripts -->
    <!-- endinjector -->
  </body>
</html>
